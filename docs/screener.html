<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本株ラボ｜条件に合う銘柄</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#19283c;background:#f5f7fb}*{box-sizing:border-box}
body{margin:0}main{max-width:960px;margin:auto;padding:16px}h1{font-size:1.45rem}
fieldset{border:1px solid #cbd5e1;border-radius:10px;padding:12px}label{display:inline-flex;align-items:center;gap:8px;margin:6px 12px 6px 0}input,button{font:inherit;border-radius:8px;padding:9px;border:1px solid #94a3b8}button{background:#19446f;color:white;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ed9b23;outline-offset:3px}
#cards{display:grid;gap:12px;margin-top:14px}.card{background:white;border:1px solid #d6e0ea;border-radius:12px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.chart{width:100%;height:auto;display:block;background:#fff;border:1px solid #dde5ee;border-radius:8px;cursor:zoom-in}summary{cursor:pointer}
.info{color:#4b5871;font-size:.94rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.actions a{color:#164a8c}
dialog{width:min(94vw,950px);max-height:90vh;border:0;border-radius:12px;padding:14px}dialog::backdrop{background:#09192ac7}dialog .chart{cursor:default}
#progress{font-weight:bold}.pill{font-size:.8rem;background:#e2e8f0;border-radius:20px;padding:4px 8px}
@media(min-width:720px){#cards{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<h1>日本株ラボ｜条件に合う銘柄</h1>
<p class="info">端末内に保存したJ-Quantsの日足データだけで候補を絞ります。直近の未取得日について、株価やローソク足を推測して描画しません。</p>
<fieldset><legend>複数条件（すべて満たす銘柄）</legend>
<label>最小前日比（％）<input id="change" type="number" step=".5" value="0" style="width:92px"></label>
<label>最小出来高<input id="volume" type="number" min="0" step="1000" value="100000" style="width:140px"></label>
<label>最低終値（円）<input id="price" type="number" min="0" value="100" style="width:100px"></label>
<label>最大候補数<input id="limit" type="number" min="1" max="100" value="30" style="width:80px"></label>
<button id="run" type="button">条件に合う銘柄を検索</button>
</fieldset>
<p id="progress" role="status">端末内の日足データを確認しています…</p>
<p class="info" id="scope"></p>
<section id="cards" aria-label="候補銘柄一覧"></section>
<dialog id="viewer" aria-label="日足チャート拡大"><button id="close" type="button">閉じる</button><h2 id="viewtitle"></h2><div id="large"></div><p id="viewnote" class="info"></p></dialog>
<p class="info">株価データをGitHub Pagesや外部サーバーに送信しません。サムネイルをタップすると端末内のデータから拡大表示します。「最新の外部チャート」は自分で開いて確認するリンクです。PDFの転載画像ではありません。条件や結果は売買推奨ではありません。</p>
</main><script>
"use strict";
const $=s=>document.getElementById(s);
let db;
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open("japan-stock-lab",1);req.onupgradeneeded=()=>req.result.createObjectStore("days");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function tx(fn){return new Promise((resolve,reject)=>{const t=db.transaction("days","readonly"),q=fn(t.objectStore("days"));q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function getDates(){return (await tx(s=>s.getAllKeys())).sort()}
async function getDay(day){const compressed=await tx(s=>s.get(day));if(!compressed)return [];const t=await new Response(compressed.stream().pipeThrough(new DecompressionStream("gzip"))).text();const lines=t.trim().split(/\r?\n/),head=lines.shift().split(",");return lines.map(line=>{const a=line.split(",");return Object.fromEntries(head.map((k,i)=>[k,a[i]||""]))})}
const val=x=>x===""||x==null?NaN:Number(x);
function candles(entries,w=480,h=160){
 const data=entries.filter(r=>[r.O,r.H,r.L,r.C].every(x=>Number.isFinite(val(x))));
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
 svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.setAttribute("role","img");svg.setAttribute("class","chart");
 svg.setAttribute("aria-label",`日足ローソク足チャート ${data.length}営業日分`);
 if(!data.length){svg.setAttribute("aria-label","ローソク足データがありません");return svg}
 const hi=Math.max(...data.map(r=>val(r.H))),lo=Math.min(...data.map(r=>val(r.L))),span=Math.max(hi-lo,.01),pad=14,step=(w-2*pad)/data.length;
 const y=v=>pad+(hi-v)/span*(h-2*pad);
 const el=(tag,attrs)=>{const e=document.createElementNS(svg.namespaceURI,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));svg.append(e)};
 data.forEach((r,i)=>{const up=val(r.C)>=val(r.O),col=up?"#bc3941":"#2371a5",x=pad+step*(i+.5);el("line",{x1:x,x2:x,y1:y(val(r.H)),y2:y(val(r.L)),stroke:col,"stroke-width":1.4});const yy=Math.min(y(val(r.O)),y(val(r.C))),height=Math.max(1,Math.abs(y(val(r.C))-y(val(r.O))));el("rect",{x:x-Math.max(1,step*.32),y:yy,width:Math.max(2,step*.64),height,fill:col})});
 return svg;
}
function code4(code){const match=String(code).match(/^(\d{4})0$/);return match?match[1]:String(code)}
async function run(){
 $("progress").textContent="条件を計算中…";$("cards").replaceChildren();
 const days=await getDates();if(days.length<2){$("progress").textContent="日足ファイルが2日分以上必要です。先にローカル株価検索ページでCSV.gzを読み込んでください。";return}
 const date=days[days.length-1],previous=days[days.length-2],latest=await getDay(date),prev=await getDay(previous),prior=new Map(prev.map(r=>[r.Code,val(r.C)]));
 const threshold=val($("change").value),minVol=val($("volume").value),minPrice=val($("price").value),limit=Math.min(100,Math.max(1,Math.floor(val($("limit").value)||30)));
 const matches=latest.map(r=>{const last=val(r.C),p=prior.get(r.Code),change=p>0?(last/p-1)*100:NaN;return {...r,last,change}}).filter(r=>Number.isFinite(r.change)&&r.change>=threshold&&val(r.Vo)>=minVol&&r.last>=minPrice).sort((a,b)=>b.change-a.change);
 $("progress").textContent=`条件に合致：${matches.length.toLocaleString("ja-JP")}銘柄　／　表示：${Math.min(limit,matches.length)}銘柄`;
 $("scope").textContent=`スクリーニング基準日：${date}。画像はこの日を終点とする最大約1か月（22取引日）の日足です。直近の未取得期間は対象外。`;
 if(!matches.length)return;
 const visible=matches.slice(0,limit),windowDays=days.slice(-22);
 const histories=new Map(visible.map(r=>[r.Code,[]]));
 for(const d of windowDays){const rows=await getDay(d);for(const r of rows){const a=histories.get(r.Code);if(a)a.push(r)}}
 for(const r of visible){
 const card=document.createElement("article");card.className="card";const head=document.createElement("div");head.className="top";
 const name=document.createElement("strong");name.textContent=`${r.Code}　終値 ${r.last.toLocaleString("ja-JP")}円`;
 const pct=document.createElement("span");pct.className="pill";pct.textContent=`前日比 ${r.change.toFixed(2)}%`;head.append(name,pct);
 const chart=candles(histories.get(r.Code));chart.setAttribute("tabindex","0");chart.setAttribute("aria-label",`${r.Code} の日足チャートを拡大`);
 const open=()=>{const dlg=$("viewer");$("viewtitle").textContent=`${r.Code}｜${date}時点の日足`;$("large").replaceChildren(candles(histories.get(r.Code),880,400));$("viewnote").textContent="保存済み最大22営業日分。現在の株価とは限りません。";dlg.showModal()};
 chart.addEventListener("click",open);chart.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
 const links=document.createElement("div");links.className="actions";const anchor=document.createElement("a");anchor.href=`https://finance.yahoo.co.jp/quote/${encodeURIComponent(code4(r.Code))}.T/chart`;anchor.target="_blank";anchor.rel="noopener noreferrer";anchor.textContent="最新の外部チャートを開く";links.append(anchor);
 card.append(head,chart,links);$("cards").append(card);
 }
}
$("close").onclick=()=>$("viewer").close();
$("run").onclick=()=>run().catch(e=>$("progress").textContent="エラー："+e.message);
openDB().then(async d=>{db=d;await run()}).catch(e=>$("progress").textContent="読み込みに失敗："+e.message);
</script></body></html>
