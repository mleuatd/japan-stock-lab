name: Test private fund backup exporter (synthetic data only)
on:
  pull_request:
    paths:
      - 'personal_fund_local_backup.py'
      - 'tests/test_personal_fund_local_backup.py'
      - '.github/workflows/test-personal-fund-backup.yml'
  push:
    branches: [main]
    paths:
      - 'personal_fund_local_backup.py'
      - 'tests/test_personal_fund_local_backup.py'
      - '.github/workflows/test-personal-fund-backup.yml'
permissions:
  contents: read
jobs:
  test-no-private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run only synthetic local backup and chart tests
        run: python -m unittest discover -s tests -p test_personal_fund_local_backup.py -v
