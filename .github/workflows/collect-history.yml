name: Collect delayed J-Quants history
on:
  push:
    branches: [main]
    paths:
      - 'export.py'
      - 'validate_archive.py'
      - 'private_archive.py'
      - '.github/workflows/collect-history.yml'
  workflow_dispatch:
    inputs:
      batch_days:
        description: Days to request this run
        required: false
        default: '600'
      start:
        description: Optional start date YYYY-MM-DD
        required: false
      end:
        description: Optional end date YYYY-MM-DD
        required: false
  schedule:
    - cron: '27 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: delayed-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check secret is configured
        env:
          API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::JQUANTS_API_KEY is absent or unavailable"
            exit 1
          fi
          echo "Secret is available (value concealed)"
      - name: Restore previous archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive/
          key: history-${{ github.run_id }}
          restore-keys: |
            history-
      - name: Restore durable private history (if configured)
        env:
          PRIVATE_ARCHIVE_REPO: ${{ vars.PRIVATE_ARCHIVE_REPO }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
        run: python private_archive.py restore
      - name: Collect price history
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DAYS: ${{ inputs.batch_days || '600' }}
        run: |
          args=(--days "$DAYS")
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          python export.py "${args[@]}"
      - name: Validate saved CSV integrity
        run: python validate_archive.py --root archive/daily
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Import all currently collected days to Neon in bounded increments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL unavailable: prices collected but import cannot run"
            exit 1
          fi
          # Source coverage is at most two years (~524 weekdays), so 30x20 is sufficient.
          # Each day commits independently; existing imports are skipped.
          # neon_import.py stops before any new day when DB >= 700MB.
          for batch in $(seq 1 30); do
            echo "Incremental Neon import batch $batch of 30"
            python neon_import.py --root archive/daily --max-days 20 --apply
          done
      - name: Back up validated days into private repository (if configured)
        env:
          PRIVATE_ARCHIVE_REPO: ${{ vars.PRIVATE_ARCHIVE_REPO }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
        run: python private_archive.py backup
      - name: Save archive cache (temporary, not permanent storage)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive/
          key: history-${{ github.run_id }}
      - name: Upload snapshot for private download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-bars-${{ github.run_id }}
          path: archive/
          retention-days: 30
