name: Collect delayed J-Quants history
on:
  push:
    branches: [main]
    paths:
      - 'export.py'
      - 'validate_archive.py'
      - '.github/workflows/collect-history.yml'
  workflow_dispatch:
    inputs:
      batch_days:
        description: Days to request this run
        required: false
        default: '20'
      start:
        description: Optional start date YYYY-MM-DD
        required: false
      end:
        description: Optional end date YYYY-MM-DD
        required: false
  schedule:
    - cron: '27 11 * * 1-5'
permissions:
  contents: read
concurrency:
  group: delayed-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check secret is configured
        env:
          API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::JQUANTS_API_KEY is absent or unavailable"
            exit 1
          fi
          echo "Secret is available (value concealed)"
      - name: Restore previous archive cache
        uses: actions/cache/restore@v4
        with:
          path: archive/
          key: history-${{ github.run_id }}
          restore-keys: |
            history-
      - name: Collect price history
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          DAYS: ${{ inputs.batch_days || '20' }}
        run: |
          args=(--days "$DAYS")
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          python export.py "${args[@]}"
      - name: Validate saved CSV integrity
        run: python validate_archive.py --root archive/daily
      - name: Save archive cache (temporary, not permanent storage)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: archive/
          key: history-${{ github.run_id }}
      - name: Upload snapshot for private download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-bars-${{ github.run_id }}
          path: archive/
          retention-days: 30
