name: Test point-in-time backtester
on:
  push:
    branches: [main]
    paths:
      - 'walkforward_backtest.py'
      - 'nightly_paper_plan.py'
      - 'discover_patterns.py'
      - 'fast_strategy_grid.py'
      - 'chart_bracket.py'
      - 'chart_similarity.py'
      - 'pattern_forward_stats.py'
      - 'joint_pattern_forecast.py'
      - 'tests/test_joint_pattern_forecast.py'
      - 'tests/test_pattern_forward_stats.py'
      - 'sql/007_pattern_forward_outcomes.sql'
      - 'tests/test_chart_similarity.py'
      - 'docs/similarity.html'
      - 'tests/test_chart_bracket.py'
      - 'docs/screener.html'
      - 'february_walkforward.py'
      - 'jpx_market_risk.py'
      - 'tests/test_jpx_market_risk.py'
      - 'tests/test_february_priority.py'
      - 'tests/test_february_walkforward.py'
      - 'tests/test_frozen_train_equivalence.py'
      - 'tests/test_corporate_accounting.py'
      - 'tests/test_fast_strategy_grid.py'
      - 'tests/test_accuracy_regression.py'
      - 'tests/test_walkforward_backtest.py'
      - 'tests/test_nightly_paper_plan.py'
      - 'tests/test_discover_patterns.py'
      - '.github/workflows/test-walkforward.yml'
      - 'neon_data_quality.py'
      - 'tests/test_neon_data_quality.py'
      - 'final_session_preflight.py'
      - 'tests/test_final_session_preflight.py'
      - 'backtest_result_gate.py'
      - 'tests/test_backtest_result_gate.py'
      - 'tests/test_suspended_sell.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lookahead, next-session execution, missing prices, fees
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate chart screener JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("docs/screener.html").read_text(encoding="utf-8")
          script = text.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/chart-screener-test.cjs").write_text(script,encoding="utf-8")
          PY
          node --check /tmp/chart-screener-test.cjs
      - name: Validate chart similarity screen JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("docs/similarity.html").read_text(encoding="utf-8")
          script=html.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/chart-similarity-test.cjs").write_text(script,encoding="utf-8")
          PY
          node --check /tmp/chart-similarity-test.cjs
