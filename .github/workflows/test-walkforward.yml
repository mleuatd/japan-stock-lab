name: Test point-in-time backtester
on:
  push:
    branches: [main]
    paths:
      - 'walkforward_backtest.py'
      - 'nightly_paper_plan.py'
      - 'discover_patterns.py'
      - 'fast_strategy_grid.py'
      - 'february_walkforward.py'
      - 'tests/test_february_priority.py'
      - 'tests/test_february_walkforward.py'
      - 'tests/test_frozen_train_equivalence.py'
      - 'tests/test_corporate_accounting.py'
      - 'tests/test_fast_strategy_grid.py'
      - 'tests/test_accuracy_regression.py'
      - 'tests/test_walkforward_backtest.py'
      - 'tests/test_nightly_paper_plan.py'
      - 'tests/test_discover_patterns.py'
      - '.github/workflows/test-walkforward.yml'
      - 'neon_data_quality.py'
      - 'tests/test_neon_data_quality.py'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lookahead, next-session execution, missing prices, fees
        run: python -m unittest discover -s tests -p 'test_*.py' -v
