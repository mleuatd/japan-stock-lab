name: Test point-in-time backtester
on:
  push:
    branches: [main]
    paths:
      - 'walkforward_backtest.py'
      - 'nightly_paper_plan.py'
      - 'discover_patterns.py'
      - 'tests/test_walkforward_backtest.py'
      - 'tests/test_nightly_paper_plan.py'
      - 'tests/test_discover_patterns.py'
      - '.github/workflows/test-walkforward.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test lookahead, next-session execution, missing prices, fees
        run: python -m unittest discover -s tests -p 'test_*backtest.py' -v && python -m unittest discover -s tests -p 'test_nightly_paper_plan.py' -v && python -m unittest discover -s tests -p 'test_discover_patterns.py' -v
