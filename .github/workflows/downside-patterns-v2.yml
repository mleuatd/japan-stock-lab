name: Downside-first pattern research v2
on:
  push:
    branches: [main]
    paths:
      - 'downside_pattern_research.py'
      - 'downside_pattern_storage.py'
      - 'sql/008_downside_patterns_v2.sql'
      - '.github/workflows/downside-patterns-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-private-downside-patterns-v2
  cancel-in-progress: false
jobs:
  private-downside-horizon-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run downside pattern catalog and risk statistics tests
        run: python -m unittest discover -s tests -p 'test_downside_pattern_research.py' -v
      - name: Install private PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Scan private daily bars and upsert aggregated 1-30-session risk
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Private DATABASE_URL missing"; exit 1; }
          python downside_pattern_research.py --from-neon --write-db --train-end 2026-01-30 --holdout-start 2026-02-02
      - name: Confirm raw market prices were not published
        run: echo "Only aggregated named-pattern risk rows are stored in private Neon."
