name: Historical JPY 500k Conditional Portfolio Replay
on:
  push:
    branches: [main]
    paths:
      - 'portfolio_500k_conditional.py'
      - 'february_walkforward.py'
      - 'tests/test_portfolio_500k_conditional.py'
      - '.github/workflows/portfolio-500k-conditional.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-portfolio-500k-large-batch
  cancel-in-progress: false
jobs:
  audited-paper-capital-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests, including exact day30 and 100-share cash ledger
        run: |
          python -m unittest discover -s tests -p 'test_portfolio_500k_conditional.py' -v
          python -m unittest discover -s tests -p 'test_february_walkforward.py' -v
      - name: Install private PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Compare old 5d, HOLD30, evidence-led 2–5% exit on private prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Private DATABASE_URL missing"; exit 1; }
          python portfolio_500k_conditional.py
      - name: Clarify research status
        run: echo "Provisional 50万円 historical paper replay only. No trading approval."
