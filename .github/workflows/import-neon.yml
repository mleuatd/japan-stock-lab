name: Import archived days to Neon Free
on:
  workflow_dispatch:
  schedule:
    # 23:15 JST on weekdays, after the existing evening collection job.
    - cron: '15 14 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'neon_import.py'
      - 'tests/test_neon_import.py'
      - '.github/workflows/import-neon.yml'
permissions:
  contents: read
concurrency:
  group: private-neon-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require private Neon connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL not configured. No changes made."
            exit 1
          fi
      - name: Restore archived daily files (temporary cache)
        uses: actions/cache/restore@v4
        with:
          path: archive/
          key: history-neon-import-${{ github.run_id }}
          restore-keys: |
            history-
      - name: Restore private durable history if configured
        env:
          PRIVATE_ARCHIVE_REPO: ${{ vars.PRIVATE_ARCHIVE_REPO }}
          PRIVATE_ARCHIVE_TOKEN: ${{ secrets.PRIVATE_ARCHIVE_TOKEN }}
        run: python private_archive.py restore
      - name: Validate before import
        run: python validate_archive.py --root archive/daily
      - name: Install Postgres client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Import at most 20 new archive days
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python neon_import.py --root archive/daily --max-days 20 --apply
      - name: Warn about non-durable source cache
        run: echo "Neon is not an independent raw CSV backup; configure private archival storage."
