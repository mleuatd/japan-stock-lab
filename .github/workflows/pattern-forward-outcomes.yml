name: Pattern forward outcomes (1-30 trading sessions)
on:
  push:
    branches: [main]
    paths:
      - 'pattern_forward_stats.py'
      - 'sql/007_pattern_forward_outcomes.sql'
      - '.github/workflows/pattern-forward-outcomes.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-private-pattern-outcomes
  cancel-in-progress: false
jobs:
  calculate-private-aggregates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test 30-session forward pattern math and non-leaking split
        run: python -m unittest discover -s tests -p 'test_pattern_forward_stats.py' -v
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Stream private Neon prices and store aggregate-only pattern outcomes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Missing DATABASE_URL"; exit 1; }
          python pattern_forward_stats.py --from-neon --write-db --train-end 2026-01-30 --holdout-start 2026-02-02
      - name: Confirm summary counts only (no licensed rows)
        run: echo "Pattern aggregate analysis completed; no private daily prices exported."
