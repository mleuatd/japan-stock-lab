name: February 2026 Frozen Walk-forward
on:
  workflow_dispatch:
    inputs:
      diagnose_fixed_rule:
        description: "Reproduce prior selected rule without re-training (diagnostic only)"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: private-february-backtest
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for frozen time-boundary
        run: python -m unittest discover -s tests -p 'test_february_walkforward.py' -v
      - name: Install private Neon client
        run: python -m pip install 'psycopg[binary]>=3,<4'
      - name: Preflight aggregate coverage at final session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL unavailable"
            exit 1
          fi
          python final_session_preflight.py
      - name: Train only through January 30 and replay from February 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL unavailable; no actual backtest executed"
            exit 1
          fi
          if [ "${{ inputs.diagnose_fixed_rule }}" = "true" ]; then
            # Frozen candidate from recorded historical run 37992284803.
            python february_walkforward.py --from-neon --cutoff 2026-01-30 --start 2026-02-02 --fixed-rule-json '{"lookback":3,"min_return_pct":-10,"min_volume":0}' --out private-february-walkforward.json
          else
            python february_walkforward.py --from-neon --cutoff 2026-01-30 --start 2026-02-02 --out private-february-walkforward.json
          fi
          # Print only aggregate account-level metrics, no licensed stock row export.
          python - <<'PY'
          import json
          r=json.load(open("private-february-walkforward.json"))
          paper=r.get("paper_result",{})
          curve=paper.get("equity",[])
          print("status",r["status"],"rules_tested",r["rules_tested"],
                "filled_events",len(paper.get("fills",[])),"ending_cash",paper.get("cash"),
                "ending_equity",curve[-1]["total_equity"] if curve else None,
                "valuation_diagnostics",paper.get("valuation_diagnostics"))
          PY
          python backtest_result_gate.py private-february-walkforward.json
      - name: Ensure no privately licensed data persists in runner
        if: always()
        run: rm -f private-february-walkforward.json
